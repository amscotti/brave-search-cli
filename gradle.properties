org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g

# Every build resolves from a clean cache, so a rate-limited repository reaches Gradle itself.
# Gradle retries a transient failure (an HTTP 429 or 5xx, a dropped connection) with a doubling
# pause, but its default budget of three attempts within three seconds is shorter than a
# rate-limit window lasts, and an exhausted budget surfaces as a plugin or artifact that "was
# not found". Eight attempts from two seconds keep trying for about four minutes, and the span
# stays bounded so a resolution that cannot succeed still fails within minutes.
# RepositoryRetryBudgetTest pins both the span and the property names against the running Gradle.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
