          }

          mise_version="$(mise --version | awk '{print $1}')"
          echo "mise version: $mise_version"
          minimum_mise="2026.7.14"
          if is_older "$minimum_mise" "$mise_version"; then
            echo "mise $mise_version is older than the required minimum $minimum_mise" >&2
            exit 1
          fi

