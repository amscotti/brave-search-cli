          if-no-files-found: error

  build-linux-aarch64:
    name: build (linux-aarch64)
    needs: [resolve-and-verify-tag]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.resolve-and-verify-tag.outputs.version }}
