      - name: Run the tampered-dependency drill against the tagged sources
        run: env -u GRAALVM_HOME mise exec -- ./gradlew --no-daemon --console=plain dependencyTamperProof
      - name: Upload drill evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tamper-drill-evidence
          path: build/reports/dependency-tamper-proof/evidence.txt
