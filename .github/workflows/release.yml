          if-no-files-found: error

  verify-macos-aarch64:
    name: verify (macos-aarch64)
    needs: [resolve-and-verify-tag, build-macos-aarch64]
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.resolve-and-verify-tag.outputs.version }}
    steps:
      - name: Download the packaged release directory
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-macos-aarch64
          path: release
      - name: Validate checksums before trusting the artifact
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 -c SHA256SUMS 2>&1 | tee ../verify.log
      - name: Unpack, rerun the binary, and record evidence
        run: |
          set -euo pipefail
          cd release
          archive="$(ls brave-search-*.tar.gz)"
          dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$dir"
          bin="$dir/${archive%.tar.gz}/bin/brave-search"
          test -x "$bin"
          file "$bin" | tee -a ../verify.log
          file "$bin" | grep -q 'arm64'
          "$bin" --version 2>&1 | tee -a ../verify.log
          "$bin" --version | grep -qx "brave-search $RELEASE_VERSION"
          "$bin" --definitely-bogus >/dev/null 2>&1 && exit 1 || test $? -ne 0
      - name: Upload verification evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: verification-macos-aarch64
          path: verify.log
          if-no-files-found: error

