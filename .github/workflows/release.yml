  publish-release:
    name: publish the verified release
    needs: [verify-macos-aarch64, verify-linux-x86-64, verify-linux-aarch64, tamper-drill]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - name: Download every platform's release directory
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: release
          pattern: release-*
      - name: Attest build provenance for the archives
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: release/*/*.tar.gz
      - name: Publish archives, SBOMs, and one aggregate checksum file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          # stage every platform archive and SBOM flat; the per-platform checksum files stay
          # behind: they are verification inputs whose basenames would collide as release assets
          cp release/*/*.tar.gz release/*/*.sbom.json "$staging"/
          # one aggregate checksum file over every published archive and SBOM, sorted by name
          (
            cd "$staging"
            sha256sum -- *.tar.gz *.sbom.json | LC_ALL=C sort -k 2 > SHA256SUMS
          )
          # publishing is re-runnable: a transient failure mid-upload leaves the release object
          # in place with incomplete assets, and a plain recreate would then fail permanently on
          # "release already exists", so the release is created only when missing and every
          # asset uploads with --clobber to replace any half-uploaded file wholesale
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "$staging"/*.tar.gz \
            "$staging"/*.sbom.json \
            "$staging"/SHA256SUMS \
            --clobber
