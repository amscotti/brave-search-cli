      - name: Build the release archive and checksums from the verified tag version
        run: env -u GRAALVM_HOME mise exec -- ./gradlew --no-daemon --console=plain -PreleaseVersion="$RELEASE_VERSION" releaseArchive sha256Sums
      - name: Upload the release directory
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
