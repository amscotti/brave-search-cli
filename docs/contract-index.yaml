# Stable requirement identifiers of the CLI contract: each maps to its normative section in
# docs/cli-contract.md, docs/config-security.md, docs/brave-api-contract.md, or
# docs/release.md and to one executable test that pins it. Verified by
# io.amscotti.bravesearch.docs.ContractIndexTest.
#
# The pinning tests are the JVM process tests cited below. The native smoke suite
# (src/nativeSmokeTest) runs the agreeing subset of the same scenarios against the native
# executable — a source-set limitation of that suite, not a narrower contract.
